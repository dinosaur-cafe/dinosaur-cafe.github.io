<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR منو</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<link rel="stylesheet" href="assets/style.css?v=5">
<style>
  body{display:flex;flex-direction:column;align-items:center;gap:18px;padding:28px 16px}
  .card{background:var(--cup);border:4px solid var(--ink);border-radius:28px;padding:26px 26px 20px;text-align:center;width:min(92vw,420px);box-shadow:0 6px 0 var(--ink)}
  .card .logo{position:static;width:100%;animation:none;margin-bottom:10px}
  .qr{position:relative;width:100%;aspect-ratio:1}
  .qr svg{width:100%;height:100%;display:block}
  .qr .mid{position:absolute;left:50%;top:50%;width:24%;transform:translate(-50%,-50%);background:var(--cup);border-radius:18%;padding:3%}
  .qr .mid img{width:100%;display:block}
  .card h1{font-size:32px;font-weight:400;margin-top:12px}
  .card p{font-family:Vazirmatn,sans-serif;font-size:12px;color:var(--ink-soft);direction:ltr;word-break:break-all;margin-top:4px}
  .tools{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .tools button,.tools a{font-size:18px;padding:8px 18px 6px;border:2.5px solid var(--ink);border-radius:999px;background:var(--green);color:var(--ink);text-decoration:none}
  @media print{.tools{display:none}body{padding:0}.card{box-shadow:none}}
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="assets/img/logo.png" alt="COFFEE">
    <div class="qr" id="qr"></div>
    <h1>برای دیدن منو اسکن کنید</h1>
    <p id="url"></p>
  </div>
  <div class="tools">
    <button id="printBtn" type="button">چاپ</button>
    <a id="dl" download="menu-qr.svg">دانلود SVG</a>
    <a href="./">دیدن منو</a>
  </div>
<script src="assets/qrcode.js"></script>
<script src="assets/qr-page.js?v=5"></script>
</body>
</html>
